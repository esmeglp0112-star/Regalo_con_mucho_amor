<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida 💙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #030712;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px 10px;
            text-align: center;
            position: relative;
        }
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #030712;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
            transition: opacity 0.6s ease;
        }
        .welcome-card {
            background: rgba(15, 25, 45, 0.95);
            border: 2px solid #00d2ff;
            padding: 30px 20px;
            border-radius: 20px;
            max-width: 90%;
            width: 340px;
            box-shadow: 0 0 35px rgba(0, 210, 255, 0.5);
            text-align: center;
        }
        .welcome-card h2 {
            color: #7df9ff;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }
        .welcome-card p {
            color: #ffffff;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .open-btn {
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
        }
        header {
            z-index: 10;
            margin-top: 10px;
        }
        h1 {
            font-size: 1.3rem;
            color: #7df9ff;
            text-shadow: 0 0 10px rgba(125, 249, 255, 0.6);
            margin-bottom: 5px;
        }
        .date {
            font-size: 1rem;
            color: #ff6f61;
            font-weight: bold;
        }
        .bouquet-section {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .icon-art {
            font-size: 55px;
            filter: drop-shadow(0 0 15px #00d2ff);
        }
        .card {
            background: rgba(10, 20, 35, 0.85);
            border: 2px solid #00d2ff;
            padding: 15px 20px;
            border-radius: 18px;
            max-width: 90%;
            width: 330px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            z-index: 10;
            margin-bottom: 10px;
        }
        .card p {
            font-size: 1.15rem;
            color: #ffffff;
            font-weight: 500;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            z-index: 1;
        }
        .moving-car {
            position: absolute;
            font-size: 30px;
            z-index: 5;
            white-space: nowrap;
            pointer-events: none;
            animation: drive linear infinite;
        }
        @keyframes drive {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(calc(100vw + 100px)); }
        }
    </style>
</head>
<body>

    <!-- Audio romántico directo -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3" type="audio/mpeg">
    </audio>

    <div id="welcome-screen">
        <div class="welcome-card">
            <h2>Para el amor de mi vida 🤍</h2>
            <p>Este regalo es para ti en este día muy especial (30/09/2026). Gracias por existir en mi vida.</p>
            <button class="open-btn" onclick="startExperience()">Abrir sorpresa 🎁</button>
        </div>
    </div>

    <header>
        <h1>Feliz Día de los Carritos Hot Wheels 🚗💨</h1>
        <div class="date">30 / 09 / 2026 💙</div>
    </header>

    <div class="bouquet-section">
        <span class="icon-art">💙</span>
        <span class="icon-art">💐</span>
        <span class="icon-art">✨</span>
    </div>

    <div class="card">
        <p id="message">Mi lugar feliz eres tú. 💙</p>
    </div>

    <script>
        function startExperience() {
            const music = document.getElementById('bg-music');
            music.play().catch(e => console.log("Audio error:", e));

            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            setTimeout(() => {
                welcome.style.display = 'none';
            }, 600);
        }

        const messages = [
            "Mi lugar feliz eres tú. 💙",
            "Eres la casualidad más bonita. ✨",
            "Gracias por existir. 🚗",
            "Pienso en ti más de lo que imaginas. 🥺",
            "Me encantas de aquí a las estrellas. 🌟",
            "Contigo, cada día es especial. 💖",
            "Todo es mejor contigo a mi lado. 🏎️"
        ];

        let index = 0;
        const msgElement = document.getElementById("message");

        setInterval(() => {
            index = (index + 1) % messages.length;
            msgElement.style.opacity = 0;
            setTimeout(() => {
                msgElement.textContent = messages[index];
                msgElement.style.opacity = 1;
            }, 300);
        }, 3500);

        for (let i = 0; i < 35; i++) {
            let star = document.createElement("div");
            star.className = "star";
            star.style.top = Math.random() * 100 + "vh";
            star.style.left = Math.random() * 100 + "vw";
            star.style.width = (Math.random() * 2 + 1) + "px";
            star.style.height = star.style.width;
            document.body.appendChild(star);
        }

        const carEmojis = ["🏎️", "🚗", "🚙", "🏎️💨"];
        for (let i = 0; i < 4; i++) {
            let car = document.createElement("div");
            car.className = "moving-car";
            car.textContent = carEmojis[Math.floor(Math.random() * carEmojis.length)];
            car.style.top = (20 + Math.random() * 60) + "vh";
            car.style.animationDuration = (4 + Math.random() * 3) + "s";
            car.style.animationDelay = (Math.random() * 4) + "s";
            document.body.appendChild(car);
        }
    </script>
</body>
</html>
